<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title class="login-title">
        <mat-icon class="title-icon">point_of_sale</mat-icon>
        Super POS
      </mat-card-title>
      <mat-card-subtitle>Iniciar Sesión</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Usuario</mat-label>
          <input matInput formControlName="username" placeholder="Ingrese su usuario">
          <mat-icon matSuffix>person</mat-icon>
          <mat-error *ngIf="loginForm.get('username')?.hasError('required')">
            El usuario es requerido
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="Ingrese su contraseña">
          <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            La contraseña es requerida
          </mat-error>
        </mat-form-field>

        <button 
          mat-raised-button 
          color="primary" 
          type="submit" 
          class="login-button"
          [disabled]="loginForm.invalid || isLoading">
          <mat-spinner diameter="20" *ngIf="isLoading"></mat-spinner>
          <span *ngIf="!isLoading">Iniciar Sesión</span>
        </button>
      </form>
    </mat-card-content>

    <mat-card-footer class="login-footer">
      <div class="demo-accounts">
        <h4>Cuentas de Demostración</h4>
        <div class="account-item" (click)="fillDemoAccount('admin', 'admin123')">
          <mat-icon>admin_panel_settings</mat-icon>
          <div>
            <strong>Administrador</strong>
            <span>admin / admin123</span>
          </div>
        </div>
        <div class="account-item" (click)="fillDemoAccount('cajero1', 'cajero123')">
          <mat-icon>person</mat-icon>
          <div>
            <strong>Cajero</strong>
            <span>cajero1 / cajero123</span>
          </div>
        </div>
      </div>
    </mat-card-footer>
  </mat-card>
</div>
